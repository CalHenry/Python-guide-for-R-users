site_name: Python guide for R users
site_url: https://CalHenry.github.io/Python-guide-for-R-users
repo_url: https://github.com/CalHenry/Python-guide-for-R-users

# theme related ------
theme:
  name: material
  palette:
    # Palette toggle for system
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

nav:
  - index.md
  - terminal.md
  - python.md
  - git.md
  - coder_python.md
  - notebooks.md
  - toolkit.md

markdown_extensions:
  - tables:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.magiclink
  - pymdownx.inlinehilite
  - pymdownx.superfences          # code blocks inside admonitions etc.
  - pymdownx.blocks.admonition:    # callouts
      types:
      - new
      - settings
      - note
      - abstract
      - info
      - tip
      - success
      - question
      - warning
      - example
      - quote
  - pymdownx.mark
  - pymdownx.details
  - pymdownx.keys
  - attr_list
  - pymdownx.extra

extra_css:
  - css/extra.css
